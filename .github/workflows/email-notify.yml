name: Email Notification

on:
  workflow_call:

    inputs:

      mail_address:
        description: "Mail server address"
        default: "smtp.gmail.com"
        required: true
        type: string

      mail_port:
        description: "Mail server port"
        default: 465
        required: true
        type: number

      mail_message:
        description: "Mail message content"
        type: string

    secrets:

      email_username:
        escription: "Email username"
        required: true

      email_password:
        description: "Email password"
        required: true

      mail_receiver:
        description: "Email of the receiver"
        required: true

      mail_sender:
        description: "The notification sender displayed name"
        required: true

jobs:

  notify:
    runs-on: ubuntu-latest

    steps:

    - name: Deliver email
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ inputs.mail_address }}
        server_port: ${{ inputs.mail_port }}
        username: ${{secrets.email_username}}
        password: ${{secrets.email_password}}
        subject: GH Action ${{ github.repository }} ${{ github.workflow }} ${{ job.status }}
        to: ${{ secrets.mail_receiver }}
        from: ${{ secrets.mail_sender }}
        html_body: ${{ inputs.mail_message }}
        convert_markdown: true