name: Build Angular

on:
  workflow_call:
    outputs:
      duration: ${{ steps.duration.outputs.duration }}

jobs:

  build-image:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./angular

    steps:

    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: angular/package.json
      
    - name: Install Angular
      run: npm ci

    - name: Run Karma Tests
      id: run-tests
      run: npm run coverage -- --browsers=ChromeHeadless

    - name: Build Angular
      run: npm run build

    - name: Get steps execution time
      if: always()
      id: duration
      uses: RockyIsHere/actions-calculate-log-time@v0.2.4
      env:
        GITHUB_TOKEN: ${{ github.token }}