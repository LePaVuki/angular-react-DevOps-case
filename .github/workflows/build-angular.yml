name: build-angular

on:
  workflow_call:

    inputs:

      mail_address:
        description: "Mail server address"
        default: "smtp.gmail.com"
        required: true
        type: string

      mail_port:
        description: "Mail server port"
        default: 465
        required: true
        type: number

      image_name:
        description: "Name of the uploaded image"
        required: true
        type: string

      registry:
        description: "Package upload registry"
        required: true
        type: string

    secrets:

      email_username:
        description: "Email username"
        required: true

      email_password:
        description: "Email password"
        required: true

      mail_receiver:
        description: "Email of the receiver"
        required: true

      mail_sender:
        description: "The notification sender displayed name"
        required: true

jobs:

  build-image:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./angular

    steps:

    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: angular/package.json
      
    - name: Install Angular
      run: npm ci

    - name: Run Karma Tests
      id: run-tests
      run: npm run coverage -- --browsers=ChromeHeadless

    - name: Build Angular
      run: npm run build

    - name: Login to the Container registry
      uses: docker/login-action@v3.3.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5.5.1
      with:
        images: ${{ inputs.registry }}/${{ inputs.image_name }}
        flavor: |
          latest=true
        tags: |
          type=ref,event=branch
          type=ref,event=pr

    - name: Build and push Docker image
      uses: docker/build-push-action@v6.9.0
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Get steps execution time
      if: always()
      id: duration
      uses: RockyIsHere/actions-calculate-log-time@v0.2.4
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Deliver email
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ inputs.mail_address }}
        server_port: ${{ inputs.mail_port }}
        username: ${{secrets.email_username}}
        password: ${{secrets.email_password}}
        subject: GH Action ${{ github.repository }} ${{ github.workflow }} ${{ job.status }}
        to: ${{ secrets.mail_receiver }}
        from: ${{ secrets.mail_sender }}
        convert_markdown: true
        html_body: |
          Workflow on ${{ github.repository }}: ${{ job.status }}
          ---
          Execution time: ${{ steps.duration.outputs.duration }}
